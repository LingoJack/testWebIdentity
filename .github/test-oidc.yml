name: 只看Token

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拿并解码 Token
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.cloud.tencent.com" \
            | jq -r '.value')
          echo "===== Payload ====="
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .
