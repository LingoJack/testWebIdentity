name: 输出Token

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - name: 获取并打印 Token
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.cloud.tencent.com" \
            | jq -r '.value')
          echo "你的 token 是："
          echo "$TOKEN"
